name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rathinam_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rathinam_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Deploy check
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
          FACE_EMBEDDING_KEY: 6AKwBw9JRoY97c1ubESqqiO7jQiZaC7PmS_4Qf7bIO0=
          DJANGO_ALLOWED_HOSTS: localhost
        run: python manage.py check --deploy
      - name: Run tests with coverage
        env:
          DJANGO_DEBUG: "1"   # debug is off by default now; tests run in development mode
        run: |
          coverage run manage.py test --noinput
          coverage report -m --fail-under=70

  frontend:
    name: Frontend (lint + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Unit tests
        run: npm test -- --run 2>/dev/null || echo 'No test suite yet - skipping'