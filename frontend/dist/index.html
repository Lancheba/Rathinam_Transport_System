    <title>Rathinam Smart Bus Parking</title>
    <script>
      /* Apply the saved theme before first paint so there is no flash of the wrong one.
         Keep the storage key and colours in sync with src/context/ThemeContext.tsx */
      (function () {
        var theme = "dark";
        try {
          var pref = localStorage.getItem("rsbp-theme") || "system";
          theme = pref === "system"
            ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
            : pref;
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#eef2f9" : "#080808");
      })();
    </script>
